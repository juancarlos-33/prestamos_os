# ==============================================================================
# Configuración de Servidor Nginx como Reverse Proxy (Linux Server)
# Ubicación en Ubuntu/Debian: /etc/nginx/sites-available/prestamos
# ==============================================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Registro de accesos y errores
    access_log /var/log/nginx/prestamos_access.log;
    error_log /var/log/nginx/prestamos_error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de conexión
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Desactivar logs para favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
